<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ニャント！</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <h1>ニャント！</h1>
      <section id="catWorld" class="cat-world">
        <img
          id="catImage"
          src="images/cat-clean.png"
          alt="猫"
          class="cat-image"
        />
        <p id="catMessage">快適だにゃ</p>
      </section>

      <p class="subtitle">NyanNyanToilet</p>

      <section>
        <p>交換周期</p>

        <button id="sevenDaysButton" class="cycle-button">7日</button>
        <button id="fourteenDaysButton" class="cycle-button">14日</button>
      </section>

      <section>
        <p>最後に交換した日</p>
        <p id="lastDate">まだ記録されていません</p>
      </section>

      <section>
        <p>交換から</p>
        <p id="daysPassed">0日経過</p>
        <p id="remainingDays">次の交換まであと--日</p>
      </section>

      <section>
        <p>ここに猫と背景を表示します</p>
      </section>

      <button id="changeButton">シーツを交換した</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
